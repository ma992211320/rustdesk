name: XTBox 2.0.12 candidate installation
on:
  push:
    branches: [codex/xtbox-212-install-validation]
    paths: ['.github/workflows/xtbox-install-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, upgrade]
    steps:
      - name: Prepare and verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Install-Verified($uri,$digest,$name) {
            $file = Join-Path $env:RUNNER_TEMP "$name.exe"
            curl.exe --fail --location --retry 2 --max-time 240 --output $file $uri
            if ($LASTEXITCODE -ne 0) { throw "Candidate download failed" }
            if ((Get-FileHash $file).Hash -ne $digest) { throw "Unexpected $name installer digest" }
            $proc = Start-Process $file -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -PassThru
            if (!$proc.WaitForExit(180000)) { throw "$name installer exceeded three minutes" }
            Write-Host "$name installer exited with $($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) { throw "$name installer failed with $($proc.ExitCode)" }
          }
          if ('${{ matrix.scenario }}' -eq 'upgrade') {
            Install-Verified 'https://zero.kj1001.top/downloads/XT%E7%9B%92%E5%AD%90-Setup-2.0.11.exe' 'de2c18d88fa76c023baddea3be077a000a1fa469c15707294bae6ced4601a9ed' 'old'
            $old = Get-Item "$env:ProgramFiles/XTBox/XTBox.exe"
            if ($old.VersionInfo.ProductVersion -notmatch '^2\.0\.11(\.0)?$') { throw "Expected 2.0.11 before upgrade" }
            Get-Process XTBox -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          Install-Verified 'https://zero.kj1001.top/downloads/xtbox-candidates/XTBox-2.0.12-rc3.exe' 'd111e27947f1fb5ea8dfa55517efc48cfcf5f212d11c62f3158860eb6382d66c' 'candidate'
          $box = Get-Item "$env:ProgramFiles/XTBox/XTBox.exe"
          if ($box.VersionInfo.ProductVersion -notmatch '^2\.0\.12(\.0)?$') { throw "Unexpected XTBox version" }
          $dir = "$env:ProgramFiles/XTRemoteEngine"
          foreach ($name in 'XTRemoteEngine.exe','librustdesk.dll','flutter_windows.dll','LICENCE') {
            if (!(Test-Path -LiteralPath "$dir/$name" -PathType Leaf)) { throw "Missing $name" }
          }
          if ((Get-FileHash "$dir/XTRemoteEngine.exe").Hash -ne 'eb60f0233e8ae9efa6b2c7394c16ae1968d2165f919d02a8449030454d69dd04') { throw 'Installed engine hash mismatch' }
          Write-Host 'Installed application version and embedded engine verified.'

      - name: Verify bundled XT service and both hosted session windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='XTRemoteEngine'
          $dir=Join-Path $env:ProgramFiles $name
          $exe=Join-Path $dir "$name.exe"
          function Run-Engine([string]$flag,[string]$inputText) {
            $start=[Diagnostics.ProcessStartInfo]::new($exe,$flag)
            $start.WorkingDirectory=$dir
            $start.UseShellExecute=$false
            $start.RedirectStandardInput=$true
            $start.RedirectStandardOutput=($flag -ne '--install-service')
            $proc=[Diagnostics.Process]::Start($start)
            try {
              if ($start.RedirectStandardOutput) { $output=$proc.StandardOutput.ReadToEndAsync() }
              if ($inputText) { $proc.StandardInput.Write($inputText) }
              $proc.StandardInput.Close()
              if (!$proc.WaitForExit(60000)) { $proc.Kill(); throw "Engine command timed out: $flag" }
              if ($proc.ExitCode -ne 0) { throw "Engine command failed: $flag" }
              if (!$start.RedirectStandardOutput) { return '' }
              if (!$output.Wait(5000)) { throw "Engine output pipe stayed open: $flag" }
              return $output.Result.Trim()
            } finally { $proc.Dispose() }
          }
          try {
            Write-Host 'Registering the bundled XT service'
            $null=Run-Engine '--install-service' ''
            Write-Host 'Checking service state'
            $service=Get-Service $name
            if ($service.Status -ne 'Running') { Start-Service $name }
            $service.WaitForStatus('Running',[TimeSpan]::FromSeconds(30))
            Write-Host 'Reading device ID'
            $deadline=(Get-Date).AddSeconds(60)
            do {
              $peer=Run-Engine '--get-id' ''
              if ($peer -match '^\d{6,16}$') { break }
              Start-Sleep 2
            } while ((Get-Date) -lt $deadline)
            if ($peer -notmatch '^\d{6,16}$') { throw 'No valid engine ID' }
            $secret=[Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(16))
            if ((Run-Engine '--xt-set-password-stdin' $secret) -ne 'Done!') { throw 'Safety password update was not acknowledged' }
            Write-Host 'Verified running XT service, device ID and acknowledged password change.'
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class XTWindowCheck {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowEx(IntPtr parent, IntPtr after, string cls, string title);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
            public static IntPtr OwnedChild(IntPtr parent, uint process) {
              IntPtr child = IntPtr.Zero;
              while ((child = FindWindowEx(parent, child, null, null)) != IntPtr.Zero) {
                uint owner; GetWindowThreadProcessId(child, out owner);
                if (owner == process) return child;
              }
              return IntPtr.Zero;
            }
          }
          '@
            foreach ($sessionMode in @('--xt-hosted-desktop','--xt-hosted-file')) {
            $form=[Windows.Forms.Form]::new()
            $panel=[Windows.Forms.Panel]::new()
            $panel.Dock='Fill'
            $form.Controls.Add($panel)
            $form.Show()
            $viewer=$null
            $viewerOut=Join-Path $env:RUNNER_TEMP "$sessionMode-out.txt"
            $viewerErr=Join-Path $env:RUNNER_TEMP "$sessionMode-err.txt"
            try {
              # Use only the disposable runner's own ID to probe native window parenting.
              $viewer=Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru -RedirectStandardOutput $viewerOut -RedirectStandardError $viewerErr -ArgumentList @($sessionMode,$peer,$panel.Handle.ToInt64().ToString(),$PID.ToString())
              $until=(Get-Date).AddSeconds(40)
              do {
                [Windows.Forms.Application]::DoEvents()
                $child=[XTWindowCheck]::OwnedChild($panel.Handle,[uint32]$viewer.Id)
                if ($child -ne [IntPtr]::Zero) { break }
                if ($viewer.HasExited) { throw "Hosted viewer exited before attaching: $($viewer.ExitCode)" }
                Start-Sleep -Milliseconds 100
              } while ((Get-Date) -lt $until)
              if ($child -eq [IntPtr]::Zero) { throw 'Missing embedded session child window' }
              [uint32]$owner=0
              $null=[XTWindowCheck]::GetWindowThreadProcessId($child,[ref]$owner)
              if ($owner -ne $viewer.Id) { throw 'Embedded window belongs to unexpected process' }
              $stableUntil=(Get-Date).AddSeconds(3)
              do {
                [Windows.Forms.Application]::DoEvents()
                if ($viewer.HasExited) { throw "$sessionMode exited after attaching: $($viewer.ExitCode)" }
                Start-Sleep -Milliseconds 100
              } while ((Get-Date) -lt $stableUntil)
              Write-Host "Verified $sessionMode native child window and startup survival."
            } finally {
              foreach ($logPath in @($viewerOut,$viewerErr)) {
                if (Test-Path $logPath) { Get-Content $logPath -Tail 60 | Write-Host }
              }
              $form.Dispose()
              if ($viewer -and !$viewer.HasExited) { $viewer.Kill(); $null=$viewer.WaitForExit(5000) }
            }
            }
          } finally {
            Get-Service $name -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Windows credential persistence and isolation
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'xt-credential-check.exe'
          curl.exe -fsSL --retry 2 --max-time 180 -o $file 'https://zero.kj1001.top/downloads/xtbox-candidates/credential-check-15a628501c2146ae.exe'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $file).Hash -ne '15a628501c2146ae5b1957b1861a3979aa759797616d7a0881a18b789eb39ca2') { throw 'Unexpected credential probe' }
          $testArgs = @('-test.v', '-test.run', '^(TestWindowsRememberedPassword|TestCredentialIsolation)$', '-test.timeout', '30s')
          $result = & $file @testArgs
          $code = $LASTEXITCODE
          $result | Write-Output
          foreach ($name in 'TestWindowsRememberedPassword','TestCredentialIsolation') {
            if (($result -join "`n") -notmatch "--- PASS: $name ") { throw "Missing test success: $name" }
          }
          if ($code -ne 0) { throw 'Windows credential validation failed' }
